[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentropolis-modelrail"
version = "0.1.0a0"
description = "Local-first governed model utility"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
modelrail = "modelrail.cli:main"

[tool.setuptools.packages.find]
include = ["modelrail*"]
